
# Pages CMS configuration refresh
# ============================================================================
# Pages CMS configuration — Vardhman Jewellers, Jammu
# Docs: https://pagescms.org/docs/configuration/
#
# Everything the website displays is edited here. Nothing is hardcoded in the
# frontend: business details, products, gallery, testimonials,
# homepage banners and About Us content all live in these files.
# After saving in Pages CMS, GitHub Actions rebuilds and deploys the site.
# ============================================================================

media:
  input: public/uploads
  output: /uploads

content:
  # --------------------------------------------------------------------------
  # 1. BUSINESS INFORMATION
  # --------------------------------------------------------------------------
  - name: business
    label: Business Information
    type: file
    path: src/data/site.json
    description: Business identity, contact details, hours, About Us, branding and footer content.
    fields:
      - name: businessName
        label: Business Name
        type: string
        required: true
        description: Shown in the header, footer and page titles everywhere on the website.
      - name: tagline
        label: Tagline
        type: string
        description: Short line shown under the business name (e.g. "The New Vardhman Jewellers").
      - name: logo
        label: Brand Logo
        type: image
        description: Used in the website header and footer.
        options:
          path: brand
      - name: favicon
        label: Favicon
        type: image
        description: Small browser-tab icon (square image works best).
        options:
          path: brand

      - name: contact
        label: Phone, WhatsApp & Email
        type: object
        fields:
          - name: phonePrimary
            label: Primary Phone Number
            type: string
            required: true
            description: Shown on Contact page, product pages and footer. Used by "Call Store" buttons.
          - name: phoneSecondary
            label: Secondary Phone Number
            type: string
          - name: whatsapp
            label: WhatsApp Number
            type: string
            required: true
            description: Country code + number, digits only (e.g. 919876543210). Used by all "Enquire on WhatsApp" buttons.
          - name: email
            label: Email Address
            type: string

      - name: address
        label: Shop Address
        type: object
        fields:
          - name: line1
            label: Address Line 1
            type: string
          - name: line2
            label: Address Line 2
            type: string
          - name: city
            label: City
            type: string
          - name: state
            label: State
            type: string
          - name: pincode
            label: PIN Code
            type: string
          - name: country
            label: Country
            type: string

      - name: googleMapsUrl
        label: Google Maps Location URL
        type: string
        description: Paste the share link from Google Maps. Used by "Get Directions" buttons.

      - name: social
        label: Social Media
        type: object
        fields:
          - name: instagramUrl
            label: Instagram Profile URL
            type: string
          - name: instagramUsername
            label: Instagram Username
            type: string
            description: Shown as text, e.g. @vardhmanjewellers
          - name: facebookUrl
            label: Facebook URL
            type: string

      - name: hours
        label: Opening Hours & Holidays
        type: object
        fields:
          - name: openingTime
            label: Opening Time
            type: string
            description: e.g. 10:30 AM
          - name: closingTime
            label: Closing Time
            type: string
            description: e.g. 8:30 PM
          - name: weeklyHolidays
            label: Weekly Holidays
            type: string
            description: e.g. "Closed on Mondays" or "Open all seven days"
          - name: specialNote
            label: Special Note
            type: string
            description: Optional note shown with the timings (festival hours etc.)

      - name: about
        label: About Us
        type: object
        fields:
          - name: heading
            label: About Us Heading
            type: string
          - name: shortIntro
            label: Short Introduction
            type: string
            description: One-line summary shown on the homepage and About page.
          - name: description
            label: Complete About Us Description
            type: text
            description: Full About Us text shown on the About page.
          - name: photo
            label: About Us Photograph
            type: image
            options:
              path: about
          - name: interiorPhotos
            label: Shop Interior Photographs
            type: image
            options:
              multiple: true
              path: about
          - name: exteriorPhotos
            label: Shop Exterior Photographs
            type: image
            options:
              multiple: true
              path: about

      - name: groupLabels
        label: Jewellery Section Names
        type: object
        description: Rename the jewellery sections shown in the navigation, homepage and collection pages. Renames apply website-wide.
        fields:
          - name: wedding
            label: Wedding Section
            type: object
            fields:
              - { name: label, label: Menu Name, type: string }
              - { name: heading, label: Page Heading, type: string }
              - { name: description, label: Page Description, type: text }
          - name: everyday
            label: Everyday Section
            type: object
            fields:
              - { name: label, label: Menu Name, type: string }
              - { name: heading, label: Page Heading, type: string }
              - { name: description, label: Page Description, type: text }
          - name: gold
            label: Gold Section
            type: object
            fields:
              - { name: label, label: Menu Name, type: string }
              - { name: heading, label: Page Heading, type: string }
              - { name: description, label: Page Description, type: text }
          - name: diamond
            label: Diamond Section
            type: object
            fields:
              - { name: label, label: Menu Name, type: string }
              - { name: heading, label: Page Heading, type: string }
              - { name: description, label: Page Description, type: text }
          - name: silver
            label: Silver Section
            type: object
            fields:
              - { name: label, label: Menu Name, type: string }
              - { name: heading, label: Page Heading, type: string }
              - { name: description, label: Page Description, type: text }

      - name: footer
        label: Footer Information
        type: object
        fields:
          - name: aboutBlurb
            label: Footer About Text
            type: text
          - name: copyrightLine
            label: Copyright Line
            type: string
          - name: showOwnerLogin
            label: Show "Owner Login" Link
            type: boolean
            description: Displays a discreet Owner Login link (to Pages CMS) in the footer.

      - name: demoMode
        label: Demo Mode
        type: boolean
        description: While ON, a small "demo content" notice is shown. Turn OFF after entering real content.
      - name: demoNotice
        label: Demo Notice Text
        type: string

  # --------------------------------------------------------------------------
  # 2. HOMEPAGE CONTENT (banners, promo text, sections)
  # --------------------------------------------------------------------------
  - name: homepage
    label: Homepage Content
    type: file
    path: src/data/homepage.json
    description: Hero banners, promotional text, headings and homepage section visibility.
    fields:
      - name: hero
        label: Homepage Banner (Hero)
        type: object
        fields:
          - name: images
            label: Homepage Banner Images
            type: image
            required: true
            description: Wide campaign photographs. First image is the main banner.
            options:
              multiple:
                max: 5
              path: banners
          - name: headline
            label: Banner Headline
            type: string
          - name: subheading
            label: Banner Subheading
            type: text
          - name: primaryButtonLabel
            label: Primary Button Label
            type: string
          - name: primaryButtonLink
            label: Primary Button Link
            type: string
            description: Internal link, e.g. /collections
          - name: secondaryButtonLabel
            label: Secondary Button Label
            type: string
          - name: secondaryButtonLink
            label: Secondary Button Link
            type: string

      - name: promoText
        label: Homepage Promotional Text
        type: string
        description: Slim highlight strip shown below the banner.
      - name: video
        label: Homepage Video Advertisement
        type: object
        fields:
          - name: enabled
            label: Show Video Advertisement
            type: boolean
          - name: file
            label: Advertisement Video URL
            type: string
            description: Paste the Cloudinary Secure URL of your MP4 video.
      - name: sections
        label: Homepage Section Visibility
        type: object
        description: Switch homepage sections on or off.
        fields:
          - { name: showFeaturedWedding, label: Featured Wedding Collection, type: boolean }
          - { name: showEveryday, label: Everyday Elegance, type: boolean }
          - { name: showGold, label: Gold Jewellery, type: boolean }
          - { name: showDiamond, label: Diamond Jewellery, type: boolean }
          - { name: showTraditional, label: Traditional Jewellery, type: boolean }
          - { name: showNewArrivals, label: New Arrivals, type: boolean }
          - { name: showBestsellers, label: Bestselling Designs, type: boolean }
          - { name: showCraftsmanship, label: Our Craftsmanship, type: boolean }
          - { name: showWhyUs, label: Why Vardhman Jewellers, type: boolean }
          - { name: showTestimonials, label: Customer Testimonials, type: boolean }
          - { name: showReviews, label: Customer Reviews, type: boolean }
          - { name: showVisitStore, label: Visit Our Store, type: boolean }
          - { name: showGallery, label: Gallery Albums, type: boolean }

      - name: featuredProductIds
        label: Featured Products on Homepage
        type: string
        list: true
        description: Product IDs (e.g. VJ-GB-001) to feature on the homepage, in this order.

      - name: newArrivalsHeading
        label: New Arrivals Heading
        type: string
      - name: bestsellersHeading
        label: Bestselling Designs Heading
        type: string
      - name: reviewsHeading
        label: Reviews Section Heading
        type: string

      - name: craftsmanship
        label: Our Craftsmanship Section
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text }
          - name: image
            label: Photograph
            type: image
            options:
              path: banners

      - name: whyUs
        label: Why Vardhman Jewellers Section
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - name: points
            label: Points
            type: object
            list:
              min: 1
              max: 6
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }

      - name: visitStore
        label: Visit Our Store Section
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text }

      - name: seo
        label: Homepage SEO
        type: object
        fields:
          - { name: title, label: Homepage Title (SEO), type: string }
          - { name: description, label: Homepage Meta Description, type: text }
          - name: ogImage
            label: Social Share Image
            type: image
            options:
              path: banners

  
  # --------------------------------------------------------------------------
  # 4. JEWELLERY PRODUCTS
  # --------------------------------------------------------------------------
  - name: products
    label: Jewellery Products
    type: collection
    path: src/content/products
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [name, photos, category, occasion]
      primary: name
      sort: updatedAt
      order: desc
    fields:
      - name: name
        label: Product Name
        type: string
        required: true

      - name: photos
        label: Product Image
        type: image
        required: true
        options:
          multiple:
            max: 8
          unique: true
          path: products

      - name: category
        label: Category
        type: reference
        required: true
        options:
          collection: categories
          search: "name"
          value: "{path}"
          label: "{fields.name}"

      - name: occasion
        label: Occasion
        type: select
        required: true
        options:
          values:
            - { name: everyday, label: Everyday }
            - { name: wedding, label: Wedding }
            - { name: traditional, label: Traditional }
            - { name: festive, label: Festive }
            - name: material
        label: Material (Optional)
        type: string
        description: Enter material and purity, e.g. 14 Karat Gold. Leave empty if not applicable.

      - name: body
        label: Description
        type: rich-text

        # --------------------------------------------------------------------------
  # GOLD JEWELLERY PRODUCTS
  # --------------------------------------------------------------------------
  - name: goldProducts
    label: Gold Jewellery
    type: collection
    path: src/content/goldProducts
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: name
      sort: updatedAt
      order: desc
    fields:
      - name: name
        label: Product Name
        type: string
        required: true

      - name: photos
        label: Product Image
        type: image
        required: true
        options:
          multiple:
            max: 8
          unique: true
          path: products

      - name: category
        label: Category
        type: reference
        required: true
        options:
          collection: categories
          search: "name"
          value: "{path}"
          label: "{fields.name}"

      - name: occasion
        label: Occasion
        type: select
        required: true
        options:
          values:
            - { name: everyday, label: Everyday }
            - { name: wedding, label: Wedding }
            - { name: traditional, label: Traditional }
            - { name: festive, label: Festive }
      - name: material
        label: Material (Optional)
        type: string
        description: Enter material and purity, e.g. 14 Karat Gold. Leave empty if not applicable.
      - name: body
        label: Description
        type: rich-text 

  # ------# --------------------------------------------------------------------------
  # DIAMOND JEWELLERY PRODUCTS
  # --------------------------------------------------------------------------
  - name: diamondProducts
    label: Diamond Jewellery
    type: collection
    path: src/content/diamondProducts
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: name
      sort: updatedAt
      order: desc
    fields:
      - name: name
        label: Product Name
        type: string
        required: true

      - name: photos
        label: Product Image
        type: image
        required: true
        options:
          multiple:
            max: 8
          unique: true
          path: products

      - name: category
        label: Category
        type: reference
        required: true
        options:
          collection: categories
          search: "name"
          value: "{path}"
          label: "{fields.name}"

      - name: occasion
        label: Occasion
        type: select
        required: true
        options:
          values:
            - { name: everyday, label: Everyday }
            - { name: wedding, label: Wedding }
            - { name: traditional, label: Traditional }
            - { name: festive, label: Festive }
      - name: material
        label: Material (Optional)
        type: string
        description: Enter material and purity, e.g. 14 Karat Gold. Leave empty if not applicable.  
      - name: body
        label: Description
        type: rich-text
        # --------------------------------------------------------------------------
  # 6. JEWELLERY CATEGORIES (REFERENCE SOURCE)
  # --------------------------------------------------------------------------
  - name: categories
    label: Jewellery Categories
    type: collection
    path: src/content/categories
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [name]
      primary: name
    fields:
      - name: name
        label: Category Name
        type: string
        required: true
        readonly: true
  # --------------------------------------------------------------------------
  # 6. GALLERY MANAGEMENT
  # --------------------------------------------------------------------------
  - name: albums
    label: Gallery Management
    type: collection
    path: src/content/albums
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: name
      sort: order
      order: asc
    fields:
      - name: name
        label: Album Name
        type: string
        required: true
      - name: description
        label: Album Description
        type: text
      - name: coverImage
        label: Album Cover
        type: image
        required: true
        options:
          path: gallery
      - name: images
        label: Photographs
        type: object
        description: Drag to reorder. The order here is the order shown on the website.
        list:
          collapsible:
            collapsed: true
            summary: "Photo {index}"
        fields:
          - name: src
            label: Photograph
            type: image
            required: true
            options:
              path: gallery
          - name: caption
            label: Caption
            type: string
      - name: order
        label: Display Order
        type: number
      - name: published
        label: Published
        type: boolean
        description: Turn OFF to hide the entire album from the website.
      - name: featuredOnHomepage
        label: Feature on Homepage
        type: boolean

  # --------------------------------------------------------------------------
  # 7. CUSTOMER TESTIMONIALS
  # --------------------------------------------------------------------------
  - name: testimonials
    label: Customer Testimonials
    type: collection
    path: src/content/testimonials
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: customerName
      sort: order
      order: asc
    fields:
      - name: customerName
        label: Customer Name
        type: string
        required: true
      - name: location
        label: Location
        type: string
      - name: quote
        label: Testimonial
        type: text
        required: true
      - name: rating
        label: Rating (1–5)
        type: number
      - name: order
        label: Display Order
        type: number
      - name: published
        label: Published
        type: boolean

  # --------------------------------------------------------------------------
  # 8. CUSTOMER REVIEWS
  # --------------------------------------------------------------------------
  - name: reviews
    label: Customer Reviews
    type: collection
    path: src/content/reviews
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: customerName
        label: Customer Name
        type: string
        required: true
      - name: location
        label: Location
        type: string
      - name: rating
        label: Star Rating (1–5)
        type: number
        required: true
      - name: title
        label: Review Title
        type: string
      - name: review
        label: Review Text
        type: text
        required: true
      - name: productName
        label: Product Purchased (optional)
        type: string
        description: Shown with the review, e.g. "Royal 22K Gold Bangle".
      - name: date
        label: Review Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: order
        label: Display Order
        type: number
      - name: published
        label: Published
        type: boolean
        description: Turn OFF to hide this review without deleting it.

settings:
  commit:
    message: "Content update via Pages CMS"
